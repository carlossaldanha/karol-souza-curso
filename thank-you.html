<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obrigado! — Karol Souza</title>
  <meta name="description" content="Obrigado por se cadastrar! Em breve voce recebera dicas de nail art no seu email.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💅</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --pink: #ec4899; --dark: #0f0a14; --dark2: #1a1322; --dark3: #251b2f; --gray: #9ca3af; --gray-light: #d1d5db; --green: #34d399; --border: #2d2238; }
    body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--dark); color: var(--gray-light); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    .container { max-width: 600px; margin: 0 auto; padding: 80px 24px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .check { width: 80px; height: 80px; border-radius: 50%; background: rgba(52,211,153,0.15); display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 24px; border: 2px solid var(--green); }
    h1 { font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 12px; letter-spacing: -1px; }
    p { color: var(--gray); font-size: 16px; margin-bottom: 24px; }
    .btn { display: inline-block; padding: 14px 32px; background: var(--pink); color: #fff; border-radius: 999px; font-weight: 700; font-size: 15px; text-decoration: none; box-shadow: 0 12px 32px rgba(236,72,153,0.4); }
    .btn:hover { transform: translateY(-2px); }
    footer { background: var(--dark2); color: var(--gray); text-align: center; padding: 24px; font-size: 13px; border-top: 1px solid var(--border); }
    footer strong { color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="check">✓</div>
    <h1>Cadastro realizado!</h1>
    <p>Obrigado por se cadastrar. Em breve voce recebera dicas de nail art, tutoriais e ofertas exclusivas no seu email.</p>
    <p style="color:var(--gray);font-size:14px;">Enquanto isso, confira nosso curso completo de Nail Art Profissional.</p>
    <a href="index.html" class="btn">Voltar ao site</a>
  </div>
  <footer><strong>Karol Souza</strong> — Curso Nail Art Profissional · © 2026</footer>
</body>
</html>
